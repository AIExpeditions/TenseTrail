# Wrangler settings for the feedback Worker. Used by `npx wrangler deploy` (run in this folder)
# and by .github/workflows/deploy-worker.yml. See worker/README.md.
name = "tensetrail-feedback"
main = "feedback-worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Keep the Text variables set in the dashboard (GEMINI_MODEL, ALLOWED_ORIGINS, ALLOW_NO_RL).
# Secrets (GEMINI_API_KEY, CHECK_KEY) are always kept.
keep_vars = true

# The RL rate limit: 5 marking requests per learner (IP address) per 60 seconds.
# Rate limiting can only be added here, not in the dashboard. period must be 10 or 60.
# namespace_id is any number you choose; it only needs to be unique in your Cloudflare account.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
