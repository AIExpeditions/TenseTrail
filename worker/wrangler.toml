# Wrangler settings for the feedback Worker. Used by `npx wrangler deploy` (run in this folder)
# and by .github/workflows/deploy-worker.yml. See worker/README.md.
name = "tensetrail-feedback"
main = "feedback-worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Keep the Text variables set in the dashboard (GEMINI_MODEL, ALLOWED_ORIGINS, ALLOW_NO_RL).
# Secrets (GEMINI_API_KEY, CHECK_KEY) are always kept.
keep_vars = true

# The RL rate limit: 5 marking requests per learner (IP address) per 60 seconds.
# Rate limiting can only be added here, not in the dashboard. period must be 10 or 60.
# namespace_id is any number you choose; it only needs to be unique in your Cloudflare account.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# The daily cap: one Durable Object counts AI markings per day for the whole site (DAILY_MAX, default 800).
# Wrangler creates it on deploy; nothing to set up. (Durable Objects with SQLite storage are on the free plan.)
[[durable_objects.bindings]]
name = "USAGE"
class_name = "Usage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Usage"]

# Cloudflare Workers AI: the last fallback when Groq and Gemini are busy. No key; the free plan includes
# 10,000 "neurons" a day (roughly 200 markings) and stops there, so it never costs anything on the free plan.
[ai]
binding = "AI"

# Optional: storage for anonymous placement answers that learners choose to share (see worker/README.md,
# "Calibrating the placement test"). Create it once with: npx wrangler kv namespace create CAL
# then remove the # from the three lines below and paste the id it printed.
# [[kv_namespaces]]
# binding = "CAL"
# id = "paste-the-id-here"
