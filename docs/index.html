var EXP=["Present Simple does not mean <b>now</b>. It describes what is generally true: your routine, your job, facts about the world. That is why we say <b>I work in a bank</b> even when we are at the cinema. Use it with time words like <b>every day</b>, <b>usually</b> or <b>never</b>. The one thing to remember is the <b>-s</b> for he, she and it. In questions and negatives, <b>do</b> or <b>does</b> carries that -s, so the main verb stays simple: <b>Does she work?</b>",
"Present Continuous is about <b>the moment</b>. It describes actions in progress right now, temporary situations like <b>I am staying with a friend this week</b>, and plans already arranged like <b>We are meeting at six</b>. Build it with <b>am, is or are</b> plus a verb ending in <b>-ing</b>. Be careful with state verbs such as know, like, want and love. They describe states, not actions, so we say <b>I know</b>, not <b>I am knowing</b>.",
"Present Perfect <b>connects the past to the present</b>. You do not say when something happened. You care about the result or the experience. <b>I have lost my keys</b> means I still have a problem today. Compare <b>I lost my keys yesterday</b>, which is just a past event. Use <b>have or has</b> plus the past participle (been, done, seen, worked). Words like already, yet, just, ever and never fit well, and <b>for</b> and <b>since</b> show how long.",
"Present Perfect Continuous focuses on the <b>activity and how long</b> it has lasted, up to now. <b>I have been learning English since January</b> shows an ongoing process. It also explains a present result: <b>My hands are dirty because I have been gardening</b>. Compare it with Present Perfect: <b>I have read three chapters</b> counts the result, while <b>I have been reading</b> describes the activity. Build it with <b>have or has + been + -ing</b>.",
"Past Simple is the tense for <b>finished stories</b>. You know when it happened, or the time is clear: yesterday, last week, in 2019. Regular verbs end in <b>-ed</b>, and many common verbs are irregular and must be learned (go, went; see, saw). In questions and negatives, <b>did</b> carries the past, so the main verb goes back to its base form: <b>Did you go?</b> and <b>I didn't go</b>. Use it to tell stories in order.",
"Past Continuous <b>sets the scene</b>. It describes an action that was in progress at a moment in the past, or the background to a main event. <b>I was cooking when you called</b> gives a long action (cooking) and a shorter one that interrupted it (called). Use <b>was or were + -ing</b>. It is perfect for storytelling, because it paints the situation, while Past Simple moves the story forward.",
"Past Perfect shows <b>which of two past events happened first</b>. <b>When I arrived, the train had left</b> means the train left before I arrived. Without it, the order can be unclear. Build it with <b>had + past participle</b>, the same for every subject. You will often see it with <b>before, after, by the time</b> and <b>already</b>. If the order is obvious from the words first and then, Past Simple is often enough.",
"Past Perfect Continuous looks back from a past moment at an <b>activity that had been going on</b> for some time, often to explain a past situation. <b>She was tired because she had been working all night.</b> Build it with <b>had been + -ing</b>. It is less common than other tenses, but it is very useful for reasons, and for duration before a past point, with <b>for</b> and <b>since</b>.",
"Future Simple with <b>will</b> is for decisions made at the moment of speaking, predictions, promises and offers. <b>I'll help you</b> is an offer, and <b>It will rain</b> is a prediction. The form is easy: <b>will + base verb</b>, for every subject. In speech we usually say <b>'ll</b>. It is not the only way to talk about the future, because plans already decided often use <b>going to</b> or the present continuous, but will is the most flexible.",
"Future Continuous pictures an <b>action in progress at a particular time in the future</b>: <b>This time tomorrow I will be flying.</b> It is also a polite way to ask about plans: <b>Will you be using the car tonight?</b> Build it with <b>will be + -ing</b>. Think of putting a pin in the future and looking at what is happening at that moment.",
"Future Perfect looks back from a future point and says something will be <b>complete by then</b>. <b>By Friday I will have finished the report</b> means the work is done on or before Friday. Build it with <b>will have + past participle</b>. The key word is <b>by</b>: by Friday, by then, by the time you arrive. It is common in plans, deadlines and predictions.",
"Future Perfect Continuous is the rarest tense, but it is handy for <b>anniversaries and long processes</b>. <b>By June, I will have been working here for ten years</b> stresses how long something will have lasted by a future point. Build it with <b>will have been + -ing</b>, and expect <b>for</b> and <b>by</b> in the sentence. If it feels heavy, remember it simply adds duration to Future Perfect."];

 rm:"Could for general past ability. Was able to or managed to for one success. Couldn't for both.",

{t:"Modals: permission and obligation",lv:"B1",e:"🚦",

 nq:"Which sentences mean it is necessary? Which one means it is not necessary? Which one means don't do it?",
 ru:[["Must and have to","Both mean it is necessary. <b>Must</b> often shows the speaker's own feeling or a written rule: <b>I must call Mum.</b> <b>Have to</b> is for rules from outside: <b>I have to wear a uniform.</b>"],["Mustn't","<b>Mustn't</b> means do not do it: <b>You mustn't smoke here.</b>"],["Don't have to","<b>Don't have to</b> means it is not necessary, but you can: <b>You don't have to come.</b>"],["Permission","<b>Can</b> and <b>be allowed to</b> say it is OK: <b>You can leave early. Are we allowed to eat here?</b> For the past, use <b>had to</b> and <b>was allowed to</b>."]],
 rm:"Must or have to: necessary. Mustn't: don't do it. Don't have to: not necessary. Can or be allowed to: it's OK.",
 ms:[["You don't have to smoke here. It's against the law.","You mustn't smoke here. It's against the law.","For something that is not allowed, use mustn't, not don't have to."],["I must to go now.","I must go now.","After must, use the base verb."],["She have to work today.","She has to work today.","With he, she and it, use has to."],["Yesterday I must stay late.","Yesterday I had to stay late.","Must has no past form. Use had to."]],
 ex:["You must wear a seatbelt.","I have to renew my licence this month.","You don't have to bring anything. We've got plenty of food.","You mustn't leave children alone in the car.","Are we allowed to bring dogs to the beach?","I had to wait an hour at the doctor's."],

{t:"Modals: deductions about the present",lv:"B1",e:"🔍",
 nt:["The lights are on. They [[must be]] home.","She [[might be]] at the gym.","That [[can't be]] Tom. He's in Perth.","He [[could be]] stuck in traffic."],
 nq:"How sure is the speaker in each sentence? Which ones are nearly 100% sure?",
 ru:[["Sure it's true","<b>Must</b>: I'm sure because of the evidence. <b>She must be tired. She worked all night.</b>"],["Maybe","<b>Might, may, could</b>: it's possible. <b>He might be busy. It could be the cat.</b>"],["Sure it's not true","<b>Can't</b>: I'm sure it's impossible. <b>That can't be right.</b> Do not use mustn't for this."],["Right now","For an action happening now, use modal + be + -ing: <b>She must be working. They might be sleeping.</b>"]],
 rm:"Must: I'm sure it's true. Might, may or could: maybe. Can't: I'm sure it's not true.",
 ms:[["He mustn't be at home. His car isn't there.","He can't be at home. His car isn't there.","For something impossible, use can't, not mustn't."],["She must to be tired.","She must be tired.","After a modal, use the base verb."],["He can be in the shower. I'm not sure.","He might be in the shower. I'm not sure.","For a guess about now, use might, may or could."],["They might are sleeping.","They might be sleeping.","Modal + be + -ing for an action happening now."]],
 ex:["You've been walking all day. You must be exhausted.","Someone's at the door. It might be the postie.","That can't be the bill. It's too cheap!","Where's Mei? She could be at the library.","The car's gone. Dad must be driving to work.","Don't call now. They may be having dinner."],

 bd:[["They must be at the beach",[]],["That can't be the right address",[]]],
 gp:[["The lights are off. They ___ be out. (sure it's true)",["must"],"Must: you are sure from the evidence."],["He's only fifteen. He ___ be the driver. (sure it's not true)",["can't","cannot"],"Can't: you are sure it is impossible."],["I don't know where she is. She ___ be at work. (maybe)",["might","may","could"],"Might, may or could for maybe."]],

{t:"Modals: deductions about the past",lv:"B1",e:"🕵️",
 nt:["The ground is wet. It [[must have rained]].","She [[might have missed]] the bus.","He [[can't have seen]] my message. He hasn't replied.","They [[could have gone]] to the beach."],
 nq:"Are these guesses about now or about the past? What comes after have?",
 ru:[["The shape","Modal + <b>have</b> + past participle: <b>must have gone, might have left, can't have known</b>."],["Sure it happened","<b>Must have</b>: <b>You must have been cold.</b>"],["Maybe it happened","<b>Might have, may have, could have</b>: <b>I might have left it at work.</b>"],["Sure it didn't happen","<b>Can't have</b> or <b>couldn't have</b>: <b>She can't have finished already.</b>"]],
 rm:"Must have + past participle: sure it happened. Might, may or could have: maybe. Can't or couldn't have: sure it didn't.",

 dl:{ti:"The missing cake",sp:[["Mei","she"],["Dave","he"]],ln:[[0,"Dave, where's the chocolate cake? It was here this morning!"],[1,"Don't look at me! It [[must have been]] the kids."],[0,"It [[can't have been]] the kids. They were at school all day."],[1,"Hmm. The dog [[might have eaten]] it."],[0,"There's chocolate on your shirt, Dave."],[1,"Ah. I [[must have dropped]] some when I was looking for the dog."],[0,"Nice try!"]]},
 mc:[["The house is dark. They ___ gone to bed.",["must have","must","can't have"],0,"You're sure about the past: must have + past participle."],["I'm not sure where my phone is. I ___ left it in the car.",["must have","might have","can't have"],1,"Maybe: might have."],["She ___ seen me. She looked straight past me.",["can't have","must have","might"],0,"You're sure it didn't happen: can't have."],["He must have ___ the train.",["missed","miss","missing"],0,"Must have + past participle."]],

 gp:[["The grass is wet. It must have ___ last night. (rain)",["rained"],"Must have + past participle."],["I can't find my glasses. I might ___ left them at work. (have)",["have"],"Might have + past participle."],["He ___ have taken it. He was with me all night. (sure it didn't happen)",["can't","couldn't","cannot"],"Can't have: sure it didn't happen."]],
 pr:"You come home and your kitchen is a mess. What happened? Write four guesses with must have, might have, could have and can't have.",

{t:"The future: degrees of certainty",lv:"B1",e:"🔮",
 nt:["It'll [[definitely rain]] tomorrow.","The Crows [[are likely to win]].","I [[probably won't come]] tonight.","Prices [[are bound to go]] up."],
 nq:"How sure is the speaker about each future event? Put them in order, from very sure to not sure.",
 ru:[["Will + adverb","<b>will definitely, will probably</b>. Negative: <b>definitely won't, probably won't</b>. The adverb goes after will, but before won't."],["Likely","<b>be likely to</b> + verb: <b>It's likely to rain.</b> <b>Be unlikely to</b> means probably not."],["Bound to and sure to","Very sure: <b>She's bound to be late. He's sure to love it.</b>"],["Maybe","<b>may, might, could</b>: <b>We might go to the beach.</b> <b>May well</b> and <b>might well</b> make it more likely."]],
 rm:"Very sure: will definitely, be bound to. Probably: will probably, be likely to. Maybe: may, might, could. Probably not: probably won't, be unlikely to.",
 ms:[["I definitely won't to come.","I definitely won't come.","After won't, use the base verb with no to."],["It will likely to rain.","It is likely to rain.","Use be likely to, not will likely to."],["He won't probably come.","He probably won't come.","Probably goes before won't."],["She's bound be late.","She's bound to be late.","Bound to needs to."]],
 ex:["I'll definitely be there by six.","It's likely to be 40 degrees on Friday.","They probably won't finish the roadworks this year.","You're bound to love Kangaroo Island.","We might go to the Barossa on Sunday.","The shops are unlikely to be open on Christmas Day."],
 dl:{ti:"Weekend forecast",sp:[["Kylie","she"],["Arjun","he"]],ln:[[1,"Are we still going to Victor Harbor on Saturday?"],[0,"I hope so! The forecast says it's [[likely to be]] sunny."],[1,"Great. The beach [[is bound to be]] busy, though."],[0,"True. We'll [[definitely need]] to leave early."],[1,"I [[probably won't wake]] up before eight!"],[0,"Then I'll [[definitely bring]] coffee."],[1,"Deal. We [[might even see]] some dolphins."]]},
 mc:[["I'm ___ to be late. The traffic is terrible.",["bound","definitely","probably"],0,"Bound to: very sure."],["Which word order is correct?",["He won't probably come.","He probably won't come.","He probably will not to come."],1,"Probably goes before won't."],["It's ___ to rain. There's only a 10% chance.",["likely","unlikely","bound"],1,"Ten percent means probably not: unlikely."],["We ___ go to the cinema, but we haven't decided yet.",["might","will definitely","are bound to"],0,"Not decided yet: might."]],
 bd:[["It's likely to rain this afternoon",["This afternoon it's likely to rain"]],["I definitely won't forget your birthday",[]]],
 gp:[["Don't worry. She'll ___ love the present. (very sure, adverb)",["definitely","certainly"],"Will definitely: very sure."],["The game is ___ to sell out. Everyone wants tickets. (very sure)",["bound","sure","certain"],"Bound to: very sure."],["I ___ won't have time, but I'll try. (adverb, not very sure)",["probably"],"Probably goes before won't."]],
 pr:"Write five predictions about your next year. Use will definitely, probably won't, be likely to, might and be bound to.",

 ck:["Probably and definitely come after will but before won't.","I used to after likely and bound.","I used the base verb after will, won't and might."],
 vd:["3Eue8XvXIfk","English Grammar Rules: Future: Predictions & Probability","SmartClass by Robotel",""]},

{t:"Past modals: should have, could have, would have",lv:"B2",e:"🔁",
 nt:["I [[should have brought]] a jacket.","You [[shouldn't have eaten]] so much.","We [[could have taken]] the train.","I [[would have called]], but my phone died."],
 nq:"Did these things happen or not? How does the speaker feel?",
 ru:[["Regret and criticism","<b>Should have</b> + past participle: it was a good idea, but it didn't happen. <b>I should have studied.</b> <b>Shouldn't have</b>: it happened, but it was a bad idea."],["Missed options","<b>Could have</b>: it was possible, but it didn't happen. <b>You could have asked me!</b>"],["What you were ready to do","<b>Would have</b>: you wanted to or were ready to, but something stopped it. <b>I would have helped, but nobody told me.</b>"],["Needn't have","<b>Needn't have</b>: you did it, but it wasn't necessary. <b>I needn't have cooked. They'd already eaten.</b>"]],
 rm:"Should have: a good idea that didn't happen. Could have: a missed possibility. Would have: what you were ready to do. Then add the past participle.",
 ms:[["I should of called you.","I should have called you.","We say should've, but we write should have, never should of."],["You should have went to bed.","You should have gone to bed.","Use the past participle after have."],["I should called her.","I should have called her.","For the past, add have."],["If I knew, I would helped.","If I'd known, I would have helped.","Would have + past participle for an imagined past."]],
 ex:["I should have booked a table. The restaurant is full.","You shouldn't have said that to your boss.","We could have won if we'd trained harder.","I would have come, but I was sick.","She could have been a doctor.","I needn't have taken an umbrella. It didn't rain."],
 dl:{ti:"Late for the match",sp:[["Jess","she"],["Carlos","he"]],ln:[[0,"The first quarter has started! We [[should have left]] earlier."],[1,"I know. I [[shouldn't have stopped]] for coffee."],[0,"We [[could have caught]] the tram instead of driving."],[1,"I [[would have suggested]] it, but I thought parking was easy."],[0,"Well, we [[needn't have rushed]] for those seats. Look, they're empty!"],[1,"Sorry, Jess. Next time we'll go early."],[0,"Come on, let's find them."]]},
 mc:[["I failed the test. I ___ studied harder.",["should have","would","must have"],0,"A good idea that didn't happen: should have."],["Why didn't you tell me? I ___ helped you.",["would have","should","must have"],0,"What you were ready to do: would have."],["You ___ eaten that whole pizza. Now you feel sick.",["should have","shouldn't have","needn't"],1,"It happened, but it was a bad idea: shouldn't have."],["We ___ gone to the beach, but we stayed home.",["could have","can have","could"],0,"A missed possibility: could have."]],
 bd:[["I should have listened to you",[]],["You could have asked me for help",[]]],

{t:"Modals: probability",lv:"C1",e:"🎲",
 nt:["They [[should be]] home by now.","Prices [[may well rise]] next year.","That'll [[be]] the courier. I'm expecting a parcel.","You [[can't possibly have finished]] already!"],
 nq:"Which sentence is an expectation? Which one is a confident guess? How do well and possibly change the meaning?",
 ru:[["Expectation","<b>Should</b> and <b>ought to</b>: we expect it, if things go normally. <b>The train should arrive at six.</b> Past: <b>They should have arrived by now.</b>"],["Strong possibility","<b>May well, might well, could well</b>: quite likely. <b>She may well be right.</b>"],["Confident assumption","<b>Will</b> and <b>will have</b> for a confident guess about now or the past: <b>That'll be Tom. They'll have landed by now.</b>"],["Strong doubt","<b>Can't possibly, couldn't possibly</b>: it's impossible. <b>He can't possibly know.</b>"]],
 rm:"Should: we expect it. May well: quite likely. Will: a confident assumption. Can't possibly: impossible. Add have + past participle for the past.",
 ms:[["The plane should has landed by now.","The plane should have landed by now.","After a modal, use have, not has."],["She may well to be right.","She may well be right.","After may well, use the base verb."],["They'll arrived by now.","They'll have arrived by now.","For a past assumption, use will have + past participle."],["He can't possibly knows.","He can't possibly know.","After can't, use the base verb."]],
 ex:["The parcel should arrive on Thursday.","The new bike lane may well open next year.","Don't ring now. They'll be having dinner.","She'll have heard the news by now.","It could well be the hottest summer on record.","You can't possibly expect me to finish this today!"],
 dl:{ti:"Waiting at the airport",sp:[["Sofia","she"],["Dave","he"]],ln:[[0,"The flight from Singapore [[should have landed]] by now."],[1,"It [[may well be]] delayed. There were storms up north."],[0,"Look, the board says it's landed. [[They'll be waiting]] for their bags."],[1,"Mum [[will have packed]] far too much, as usual."],[0,"She [[can't possibly have brought]] more than last time!"],[1,"Don't bet on it. There she is, with three suitcases!"]]},
 mc:[["The parcel was sent on Monday, so it ___ arrive by Friday.",["should","must have","can't"],0,"We expect it if things go normally: should."],["Interest rates ___ go up again. Many experts expect it.",["may well","can't possibly","should have"],0,"Quite likely: may well."],["Someone's at the door. That ___ be the pizza.",["will","would have","may well have"],0,"A confident assumption about now: will."],["You ___ have read the whole book in one hour!",["can't possibly","should","will"],0,"Impossible: can't possibly."]],
 bd:[["They should have arrived by now",["By now they should have arrived"]],["Prices may well rise next year",["Next year prices may well rise"]]],
 gp:[["Mia left an hour ago, so she should ___ arrived by now. (past expectation)",["have"],"Should have + past participle."],["The concert ___ well sell out. It's very popular. (quite likely)",["may","might","could"],"May well, might well or could well: quite likely."],["Don't call him now. He'll ___ asleep. (confident assumption)",["be"],"Will be: a confident guess about now."]],
 pr:"Write about the news or your plans. Make five predictions or assumptions using should, may well, will have, can't possibly and should have.",
 md:"The new hospital should open next year. House prices may well keep rising. My cousin will have finished her exams by now. The council can't possibly fix every road this year. My parcel should have arrived yesterday.",
 ck:["I used have + past participle for the past.","I used the base verb after may well and should.","I used can't possibly for something impossible."],
 vd:["qFwXCeFEqmo","Advanced probability in English","English with Benen",""]}

{t:"Conditionals: zero and first",lv:"A2",e:"☀️",

 nq:"Which sentences are always true? Which ones are about one possible future situation? Which tense follows if?",
 ru:[["Zero conditional","If + present, present: things that are always true. <b>If you heat ice, it melts.</b> Here <b>if</b> means the same as <b>when</b>."],["First conditional","If + present, will + verb: a real possibility in the future. <b>If it rains, we'll stay home.</b>"],["No will after if","Use the present after if, even for the future: <b>If I see her</b>, not if I will see her."],["Order and comma","Either part can come first. Use a comma when if comes first: <b>If you're hungry, eat.</b> No comma: <b>Eat if you're hungry.</b>"]],
 rm:"Zero: If + present, present (always true). First: If + present, will + verb (a possible future). Never will after if.",
 ms:[["If it will rain, we'll stay home.","If it rains, we'll stay home.","Use the present after if, not will."],["She'll be happy if you will come.","She'll be happy if you come.","Even when if is second, use the present after it."],["If I see Tom tomorrow, I tell him.","If I see Tom tomorrow, I'll tell him.","For one future situation, use will in the result."],["If you heat water to 100 degrees it boils.","If you heat water to 100 degrees, it boils.","When if comes first, add a comma."]],

 bd:[["If it rains we'll stay home",["We'll stay home if it rains"]],["I'll call you if I'm late",["If I'm late I'll call you"]]],

{t:"Conditionals: second",lv:"B1",e:"💭",

{t:"Unless, as long as and in case",lv:"B1",e:"🔀",
 nt:["[[Unless]] you hurry, you'll miss the tram.","You can borrow my car [[as long as]] you fill it up.","Take a jacket [[in case]] it gets cold.","[[Even if]] it rains, we'll still go."],
 nq:"Which word means if not? Which one means only if? Which one is about being ready for something?",
 ru:[["Unless","<b>Unless</b> = if not: <b>Unless you hurry, you'll be late.</b> = If you don't hurry... Don't add another not."],["As long as","Only if: <b>You can come as long as you're quiet.</b> <b>Provided (that)</b> means the same and is more formal."],["In case","Do something now to be ready for a possible problem: <b>Take an umbrella in case it rains.</b> In case is not the same as if."],["Even if","The result doesn't change: <b>Even if it's cold, I'll swim.</b> Like if, all these words take the present for the future."]],
 rm:"Unless = if not. As long as = only if. In case = to be ready. Even if = the result stays the same. Use the present after them for the future.",
 ms:[["Unless you don't study, you'll fail.","Unless you study, you'll fail.","Unless already means if not. Don't add another not."],["Take an umbrella if it rains.","Take an umbrella in case it rains.","To be ready before something happens, use in case."],["You can stay as long as you will be quiet.","You can stay as long as you're quiet.","Use the present after as long as."],["Even it rains, we'll go.","Even if it rains, we'll go.","Say even if, not just even."]],

{t:"Inversion and conditionals",lv:"C1",e:"🎩",
